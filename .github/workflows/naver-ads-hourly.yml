name: Naver Ads - Hourly Keyword Stats

on:
  schedule:
    - cron: '17 * * * *'
      timezone: 'Asia/Seoul'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naver-ads-hourly
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Collect keyword performance (last 7 complete days)
        env:
          NAVER_API_KEY: ${{ secrets.NAVER_API_KEY }}
          NAVER_SECRET_KEY: ${{ secrets.NAVER_SECRET_KEY }}
          NAVER_CUSTOMER_ID: ${{ secrets.NAVER_CUSTOMER_ID }}
        run: python scripts/naver_ads_collect.py
      - name: Upload result (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: naver-ads-keywords-${{ github.run_id }}
          path: output/
          if-no-files-found: error
          retention-days: 30
