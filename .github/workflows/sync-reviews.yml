name: Sync AUTOGENIE Reviews

on:
  workflow_dispatch:
  schedule:
    # 매주 월요일/목요일 오전 9:30 (KST)
    - cron: '30 0 * * 1,4'

permissions:
  contents: write

jobs:
  sync-reviews:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Collect recent reviews
        run: node scripts/sync-reviews.mjs

      - name: Commit updated reviews
        run: |
          if git diff --quiet -- data/reviews.json; then
            echo "후기 변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reviews.json
          git commit -m "chore: weekly review sync"
          git push
